<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>OLX Clone - Asosiy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --olx-color: #002f34; }
        .ad-card { transition: 0.3s; border: none; background: #fff; border-radius: 8px; overflow: hidden; position: relative; }
        .ad-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .ad-img { height: 170px; object-fit: cover; }
        .price { font-weight: 700; color: var(--olx-color); font-size: 1.1rem; }
        #loader { display: none; margin: 50px auto; }
        .pagination .page-link { color: var(--olx-color); border: none; margin: 0 3px; border-radius: 4px; }
        .pagination .page-item.active .page-link { background-color: var(--olx-color); color: white; }
        .search-section { background: #fff; border-radius: 8px; }
    </style>
</head>
<body class="bg-light">

<div th:replace="~{fragments/nav-foot :: main-nav('ads')}"></div>

<div class="container mt-4">
    <div class="search-section p-4 mb-4 shadow-sm">
        <div class="row g-2">
            <div class="col-md-7">
                <input type="text" id="searchInput" class="form-control form-control-lg" placeholder="Qidiruv...">
            </div>
            <div class="col-md-3">
                <select id="categorySelect" class="form-select form-select-lg">
                    <option value="" selected>Barchasi</option>
                    <option value="FRUITS">Mevalar</option>
                    <option value="ELECTRONICS">Elektronika</option>
                    <option value="ANIMALS">Hayvonlar</option>
                    <option value="CLOTHES">Kiyimlar</option>
                    <option value="JOBS">Ish o'rinlari</option>
                    <option value="TRANSPORTS">Transport</option>
                    <option value="SPORTS">Sport</option>
                </select>
            </div>
            <div class="col-md-2">
                <button onclick="loadAds(0)" class="btn btn-dark btn-lg w-100">Izlash</button>
            </div>
        </div>
    </div>

    <div id="loader" class="text-center">
        <div class="spinner-border text-primary" role="status"></div>
    </div>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4" id="adsContainer">
    </div>

    <nav class="mt-5 mb-5">
        <ul class="pagination justify-content-center" id="paginationContainer">
        </ul>
    </nav>
</div>

<div th:replace="~{fragments/nav-foot :: main-footer}"></div>

<script>
    let currentPage = 0;
    const pageSize = 6; // Bir sahifada ko'rsatiladigan e'lonlar soni

    async function loadAds(page = 0) {
        currentPage = page;
        const container = document.getElementById('adsContainer');
        const paginationContainer = document.getElementById('paginationContainer');
        const loader = document.getElementById('loader');

        const search = document.getElementById('searchInput').value;
        const category = document.getElementById('categorySelect').value;

        // Ekranni tozalash va loderni yoqish
        loader.style.display = 'block';
        container.innerHTML = '';
        paginationContainer.innerHTML = '';

        try {
            const token = localStorage.getItem('basicAuth');
            const url = `/api/v1/ad?search=${encodeURIComponent(search)}&category=${category}&size=${pageSize}&page=${currentPage}`;

            const response = await fetch(url, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Basic ' + token
                }
            });

            if (!response.ok) throw new Error('Tarmoq xatosi');

            const result = await response.json();

            // Backenddan kelayotgan PageableDto: { data: [...], totalPages: X, ... }
            const ads = result.data;
            const totalPages = result.totalPages;

            if (!ads || ads.length === 0) {
                container.innerHTML = '<div class="col-12 text-center my-5"><h5>Hech narsa topilmadi :(</h5></div>';
                return;
            }

            // E'lonlarni render qilish
            ads.forEach(ad => {
                const imgUrl = (ad.images && ad.images.length > 0) ? ad.images[0] : 'https://via.placeholder.com/300x200?text=Rasm+yoq';

                container.innerHTML += `
                    <div class="col">
                        <div class="card h-100 ad-card shadow-sm border">
                            <img src="${imgUrl}" class="ad-img card-img-top" alt="${ad.title}">
                            <div class="card-body">
                                <h6 class="card-title text-truncate" title="${ad.title}">${ad.title}</h6>
                                <p class="price mb-1">${ad.price.toLocaleString()} ${ad.currency}</p>
                                <p class="text-muted small mb-0">
                                    <span class="badge bg-secondary opacity-75">${ad.category}</span>
                                </p>
                            </div>
                            <a href="/ads/view/${ad.id}" class="stretched-link"></a>
                        </div>
                    </div>
                `;
            });

            // Pagination tugmalarini chizish
            renderPagination(totalPages);

        } catch (error) {
            console.error("Xatolik yuz berdi:", error);
            container.innerHTML = '<div class="col-12 text-center text-danger"><p>Maʼlumotlarni yuklashda xatolik yuz berdi.</p></div>';
        } finally {
            loader.style.display = 'none';
            // Sahifa tepasiga qaytarish (ixtiyoriy)
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    function renderPagination(totalPages) {
        const paginationContainer = document.getElementById('paginationContainer');
        if (totalPages <= 1) return;

        // Oldingi sahifa tugmasi
        const prevDisabled = currentPage === 0 ? 'disabled' : '';
        paginationContainer.innerHTML += `
            <li class="page-item ${prevDisabled}">
                <button class="page-link shadow-sm" onclick="loadAds(${currentPage - 1})">« Oldingi</button>
            </li>
        `;

        // Sahifa raqamlari (agar sahifalar juda ko'p bo'lsa, bu yerda mantiqni cheklash mumkin)
        for (let i = 0; i < totalPages; i++) {
            const activeClass = i === currentPage ? 'active' : '';
            paginationContainer.innerHTML += `
                <li class="page-item ${activeClass}">
                    <button class="page-link shadow-sm" onclick="loadAds(${i})">${i + 1}</button>
                </li>
            `;
        }

        // Keyingi sahifa tugmasi
        const nextDisabled = currentPage === totalPages - 1 ? 'disabled' : '';
        paginationContainer.innerHTML += `
            <li class="page-item ${nextDisabled}">
                <button class="page-link shadow-sm" onclick="loadAds(${currentPage + 1})">Keyingi »</button>
            </li>
        `;
    }

    // Sahifa ilk bor yuklanganda
    document.addEventListener('DOMContentLoaded', () => {
        loadAds(0);
    });
</script>

</body>
</html>
