<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ro'yxatdan o'tish</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .reg-card {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body>

<div class="reg-card">
    <h3 class="text-center fw-bold mb-4">Ro'yxatdan o'tish</h3>

    <form id="registerForm">
        <div class="mb-3">
            <label class="form-label">To'liq ism (Full Name)</label>
            <input type="text" class="form-control" id="fullName" required>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Telefon</label>
                <input type="text" class="form-control" id="phone" placeholder="+998901234567" required>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" class="form-control" id="username" required>
        </div>
        <div class="mb-4">
            <label class="form-label">Parol</label>
            <input type="password" class="form-control" id="password" required>
        </div>

        <div class="d-grid">
            <button type="submit" class="btn btn-success btn-lg">Ro'yxatdan o'tish</button>
        </div>
    </form>

    <div id="message" class="mt-3 text-center"></div>
</div>

<script>
    const form = document.getElementById('registerForm');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        // RegisterDto ga mos ma'lumotlarni yig'ish
        const data = {
            fullName: document.getElementById('fullName').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
        };

        const messageDiv = document.getElementById('message');

        try {
            const response = await fetch('/api/v1/auth/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                messageDiv.innerHTML = '<span class="text-success">Muvaffaqiyatli ro\'yxatdan o\'tdingiz!</span>';
                window.location.href = "/login"
            } else {
                messageDiv.innerHTML = '<span class="text-danger">Xatolik yuz berdi. Qayta urinib ko\'ring.</span>';
            }
        } catch (error) {
            messageDiv.innerHTML = '<span class="text-danger">Server bilan aloqa uzildi.</span>';
        }
    });
</script>

</body>
</html>
