<!-- fragments/nav-foot.html -->
<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">

<div th:fragment="main-nav(activeMenu)">
  <style>
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh; /* Ekran balandligining 100% */
      margin: 0;
    }

    main {
      flex: 1 0 auto; /* Bu qism o'rtadagi kontentni kengaytirib, footerni pastga suradi */
    }

    footer {
      flex-shrink: 0; /* Footer qisqarib ketmasligi uchun */
    }

    :root {
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --primary-color: #6366f1;
      --dark-color: #1e293b;
      --text-muted: #64748b;
      --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.04), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .navbar-custom {
      background: rgba(255, 255, 255, 0.95) !important;
      backdrop-filter: blur(10px);
      padding: 12px 0;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
      border-bottom: 1px solid #f1f5f9;
      /*position: sticky;*/
      position: fixed;
      width: 100%;
      top: 0;
      /*z-index: 1000;*/
      z-index: 1050;
    }
    body{
      padding-top: 70px;
    }

    .navbar-custom .navbar-brand {
      font-weight: 800;
      font-size: 1.2rem;
      letter-spacing: -0.5px;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* USD Rate Badge */
    .usd-rate-section {
      display: flex;
      align-items: center;
      gap: 10px;
      order: -1;
      margin-right: auto;
    }

    .usd-rate-badge {
      background: rgba(99, 102, 241, 0.1);
      border: 1.5px solid rgba(99, 102, 241, 0.3);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--primary-color);
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .usd-rate-badge i {
      font-size: 0.95rem;
    }

    /* Navbar Buttons */
    .navbar-action-btns {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-right: 20px;
    }

    .navbar-btn-icon {
      background: rgba(99, 102, 241, 0.15);
      border: 1.5px solid rgba(99, 102, 241, 0.3);
      color: var(--primary-color);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      font-size: 0.9rem;
    }

    .navbar-btn-icon:hover {
      background: var(--primary-color);
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .navbar-btn-icon:active {
      transform: translateY(0);
    }

    .navbar-btn-icon.loading {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .navbar-btn-tooltip {
      font-size: 0.75rem;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      white-space: nowrap;
      position: absolute;
      bottom: -28px;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 1001;
    }

    .navbar-btn-icon:hover .navbar-btn-tooltip {
      opacity: 1;
    }

    /* Nav Links */
    .navbar-custom .nav-link {
      color: var(--text-muted) !important;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 8px 14px !important;
      margin: 0 2px;
      border-radius: 8px;
      transition: var(--transition);
    }

    .navbar-custom .nav-link:hover {
      color: var(--primary-color) !important;
      background: #f5f3ff;
    }

    .navbar-custom .nav-link.active {
      color: var(--primary-color) !important;
      background: #f5f3ff;
    }

    /* Logout Button */
    .btn-logout {
      background: #fee2e2;
      color: #ef4444;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition);
      cursor: pointer;
      font-size: 0.9rem;
    }

    .btn-logout:hover {
      background: #ef4444;
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
    }

    /* Mobile */
    @media (max-width: 991px) {
      .navbar-collapse {
        background: white;
        margin-top: 10px;
        padding: 15px;
        border-radius: 12px;
        box-shadow: var(--card-shadow);
      }

      .nav-item {
        margin-bottom: 8px;
      }

      .nav-item:last-child {
        margin-bottom: 0;
      }
      body{
        padding-top: 60px;
      }
    }
  </style>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
      <!-- Brand (Logo) -->
      <a class="navbar-brand me-auto" href="/index">
        <i class="fa-solid fa-hand-holding-dollar"></i> Sotx
      </a>

      <!-- Burger Button -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#mainNavbar" aria-controls="mainNavbar"
              aria-expanded="false" aria-label="Menyuni ochish">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Navbar Collapse -->
      <div class="collapse navbar-collapse" id="mainNavbar">
        <!-- Nav Links -->
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
          <li class="nav-item">
            <a class="nav-link" th:classappend="${activeMenu == 'ads'} ? 'active' : ''" href="/index">
              <i class="fas fa-building me-1"></i> Barcha elonlar
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" th:classappend="${activeMenu == 'my-ad'} ? 'active' : ''" href="/my-ad">
              <i class="fas fa-building me-1"></i> Elonlarim
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" th:classappend="${activeMenu == 'users'} ? 'active' : ''" href="/users">
              <i class="fas fa-box me-1"></i> Foydalanuvchilar
            </a>
          </li>
          <li class="nav-item ms-lg-3">
            <form th:action="@{/logout}" class="m-0">
              <button type="submit" class="btn btn-logout">
                <i class="fas fa-sign-out-alt"></i> Chiqish
              </button>
            </form>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</div>

<!-- Footer Fragment -->
<div th:fragment="main-footer">
  <style>
    footer {
      background-color: #f8fafc;
      font-size: 0.9rem;
      margin-top: auto;
    }

    footer .navbar-brand {
      font-weight: 800;
      font-size: 1.2rem;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    footer .text-muted {
      color: #64748b !important;
      font-size: 0.85rem;
      line-height: 1.6;
    }

    footer a {
      color: #64748b;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    footer a:hover {
      color: #6366f1;
    }

    footer h6 {
      font-weight: 700;
      font-size: 0.95rem;
      color: #1e293b;
    }

    @media (max-width: 576px) {
      footer {
        font-size: 0.85rem;
      }

      footer .navbar-brand {
        font-size: 1.1rem;
      }

      footer h6 {
        font-size: 0.9rem;
      }
    }
  </style>
  <footer class="py-5 mt-5 border-top">
    <div class="container">
      <div class="row align-items-center justify-content-between flex-column flex-lg-row text-center text-lg-start">
        <div class="col-lg-4 mb-4 mb-lg-0">
          <a class="navbar-brand" href="/dashboard">
            <i class="fa-solid fa-hand-holding-dollar fa-lg"></i>
            <span>Sotx</span>
          </a>
          <p class="mt-3 text-muted">
            Avtomobillar, telefonlar va ko'chmas mulk savdosi uchun ishonchli platforma.
          </p>
        </div>

        <div class="col-lg-4 text-lg-end">
          <p class="text-muted mb-2">
            © <span th:text="${#dates.year(#dates.createNow())}">2026</span> Sotx. Barcha huquqlar himoyalangan.
          </p>
          <p class="text-muted">
            Versiya 1.0 • Toshkent, O'zbekiston
          </p>
        </div>
      </div>
    </div>
  </footer>
</div>

</html>
