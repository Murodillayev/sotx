<!DOCTYPE html>
<html lang="uz" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Sahifasi</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<div class="login-container">
    <form class="login-form" th:action="@{/login}" method="post">
        <h2>Xush kelibsiz</h2>
        <p>Iltimos, hisobingizga kiring</p>

        <div class="input-group">
            <input type="tel" id="phone" name="phone" placeholder="+998 90 123 45 67" required>
            <label for="phone">Telefon raqami</label>
        </div>

        <div class="input-group">
            <input type="password" id="password" name="password" required>
            <label for="password">Parol</label>
        </div>


        <button type="submit" class="login-btn">Kirish</button>

        <div class="register-link">
            Ro'yxatdan o'tmaganmisiz? <a href="#">Ro'yxatdan o'tish</a>
        </div>
    </form>
</div>
</body>
</html>
